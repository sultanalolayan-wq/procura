# ARES — PAPER mode only. One service, one named volume for state.
#
# The API is published to 127.0.0.1 ONLY. Change that line and you are exposing
# a control surface that can halt the swarm; if you do, you must also set
# ARES_API_TOKEN, and the process will refuse to start if you have not.
#
# READ THIS BEFORE EDITING ARES_API_HOST BELOW.
# Inside the container the process MUST bind 0.0.0.0: the `ports:` mapping is
# what decides who can reach it, and it publishes to host loopback only.
# Setting ARES_API_HOST=127.0.0.1 "to be safe" binds the process to the
# container's own loopback, which the port publish cannot reach — you get a
# container that is running, healthy-looking and completely unreachable.
# Because the process refuses to bind a non-loopback address without a token,
# ARES_API_TOKEN is REQUIRED here and compose refuses to start without it.
# Generate one with:  openssl rand -hex 32   and put it in .env.

services:
  ares:
    build:
      context: .
      dockerfile: Dockerfile
    image: ares-swarm:local
    container_name: ares
    # NOT `unless-stopped`: a corrupt ledger, a bad config or an unset token is a
    # permanent failure, and restarting it forever turns a loud crash into a
    # silent loop that nobody looks at. Five attempts, then the container stays
    # down and visible in `docker compose ps`.
    restart: on-failure:5
    # PID 1 signal semantics: tini reaps children and forwards SIGTERM, so the
    # supervisor's graceful shutdown always runs.
    init: true
    env_file:
      - .env
    # NOTE: everything in `environment:` OVERRIDES the same key in `env_file:`.
    # Only values that are a property of running IN A CONTAINER belong here.
    environment:
      ARES_MODE: PAPER
      ARES_DATA_DIR: /app/var
      # Container-internal bind. See the header. Do not set this to 127.0.0.1.
      ARES_API_HOST: "0.0.0.0"
      ARES_API_PORT: "8787"
      # Interpolated from ./.env BEFORE anything starts. An empty or missing
      # token fails the `docker compose up` command itself with the message
      # below, instead of building an image and crash-looping a container whose
      # logs nobody reads. `cp .env.example .env && docker compose up --build`
      # used to fail exactly this way, forever.
      ARES_API_TOKEN: "${ARES_API_TOKEN:?ARES_API_TOKEN is unset or empty in ./.env. The container binds 0.0.0.0, and ARES refuses to start an unauthenticated non-loopback API, so it would crash-loop. Generate one with openssl rand -hex 32 and put it in .env}"
    ports:
      # host:container — loopback on the host by default. Deliberate.
      - "127.0.0.1:8787:8787"
    volumes:
      # The ledger, the memory stores and the snapshots. Losing this loses the
      # audit trail, so it is a named volume, not a container-lifetime layer.
      - ares-var:/app/var
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 256
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      # Probed over the container's OWN routable address, not 127.0.0.1. A
      # process bound to container loopback answers a loopback probe perfectly
      # while the published port reaches nothing — a green container with a dead
      # dashboard. This probe fails in that case, which is the point.
      test:
        - CMD
        - node
        - -e
        - "const h=require('node:os').hostname();fetch('http://'+h+':8787/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  ares-var:
